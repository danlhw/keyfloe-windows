<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Keyfloe Snapshot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        /* Never let the user select page text while dragging the marquee. */
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/keyfloe/snapshot/overlay-main.tsx"></script>
  </body>
</html>
